<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3daee9"/>
      <stop offset="100%" stop-color="#1d99f3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Keycap base -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#1b2024" stroke="#3daee9" stroke-width="1.5" />

  <!-- Dialpad / Numeric Matrix Dots (3x3 grid) -->
  <circle cx="8" cy="10" r="1.5" fill="#3daee9" opacity="0.9" />
  <circle cx="13" cy="10" r="1.5" fill="#3daee9" opacity="0.9" />
  <circle cx="8" cy="16" r="1.5" fill="#3daee9" opacity="0.9" />
  <circle cx="13" cy="16" r="1.5" fill="#3daee9" opacity="0.9" />
  <circle cx="8" cy="22" r="1.5" fill="#3daee9" opacity="0.9" />
  <circle cx="13" cy="22" r="1.5" fill="#3daee9" opacity="0.9" />

  <!-- "1" or "NUM" Text on Keycap -->
  <text x="21" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Active Glowing LED indicator in top right -->
  <circle cx="25" cy="7" r="2.5" fill="#2ecc71" filter="url(#glow)" />
</svg>
